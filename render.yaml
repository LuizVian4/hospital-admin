services:
  - type: web
    name: escala
    runtime: docker
    dockerfilePath: ./packages/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: escala-postgres
          property: connectionString

databases:
  - name: escala-postgres
    plan: basic-256mb
    databaseName: escala_hospital
